[project]
name = "fiorino-tab"
version = "0.1.0"
description = "Scikit-learn interface to FiorinoNano tabular foundation models (fit stores context, predict reads it)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "huggingface_hub",
    "safetensors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiorino_tab"]
